name: Build and Push Docker Images

on:
  push:
    tags:
      - "v*.*.*" # 仅在推送符合这个模式的标签时触发
  workflow_dispatch:
    inputs:
      compile_target:
        description: '选择要编译的组件 (go-emby2openlist / pelagica / unified)'
        required: true
        default: 'unified'
        type: choice
        options:
          - 'go-emby2openlist'
          - 'pelagica'
          - 'unified'
      pelagica_ref:
        description: 'Pelagica 仓库分支/标签/提交ID (仅在编译 pelagica 或 unified 时有效)'
        required: true
        default: 'main'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout go-emby2openlist
        uses: actions/checkout@v4

      - name: Checkout Pelagica
        if: ${{ github.event.inputs.compile_target == 'pelagica' || github.event.inputs.compile_target == 'unified' || github.event_name == 'push' }}
        uses: actions/checkout@v4
        with:
          repository: qian9008/pelagica
          path: pelagica
          ref: ${{ github.event.inputs.pelagica_ref == '' && 'main' || github.event.inputs.pelagica_ref }}



      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # ==========================================
      # 1. 编译并推送 go-emby2openlist (纯反代代理版)
      # ==========================================
      - name: Build and push go-emby2openlist (proxy only)
        if: ${{ github.event.inputs.compile_target == 'go-emby2openlist' || github.event_name == 'push' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:proxy-latest
            ${{ github.event_name == 'push' && format('ghcr.io/{0}:proxy-{1}', github.repository, github.ref_name) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ==========================================
      # 2. 编译并推送 pelagica (原生前端+后端)
      # ==========================================
      - name: Build and push pelagica
        if: ${{ github.event.inputs.compile_target == 'pelagica' }}
        uses: docker/build-push-action@v6
        with:
          context: ./pelagica
          file: ./pelagica/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pelagica:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ==========================================
      # 3. 编译并推送 unified (三合一融合版 - 默认主版本)
      # ==========================================
      - name: Build and push unified
        if: ${{ github.event.inputs.compile_target == 'unified' || github.event_name == 'push' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.unified
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:unified
            ${{ github.event_name == 'push' && format('ghcr.io/{0}:{1}', github.repository, github.ref_name) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
